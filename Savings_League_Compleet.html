const levels=[{name:'De Spaarstarter',icon:'🪙',tip:'Kleine bedragen regelmatig sparen helpt om een vaste gewoonte op te bouwen.',qs:[['Wat helpt om regelmatig te sparen?',['Automatisch overboeken','Alleen sparen bij een bonus','Wachten tot het einde van de maand'],0,'Automatisch sparen maakt er een gewoonte van.'],['Je spaart €5 per week. Hoeveel is dat in 4 weken?',['€15','€20','€25'],1,'Vier keer €5 is €20.'],['Wat is een spaardoel?',['Een geplande aankoop op krediet','Een concreet bedrag dat je wilt opbouwen','Een overzicht van je schulden'],1,'Een spaardoel geeft richting aan je spaargeld.'],['Welke gewoonte helpt je spaargeld beschermen?',['Het apart zetten van spaargeld','Je spaargeld dagelijks uitgeven','Alle uitgaven negeren'],0,'Een aparte spaarpot helpt om geld niet onbedoeld uit te geven.'],['Je legt €10 per maand apart. Hoeveel na 6 maanden, zonder rente?',['€50','€70','€60'],2,'6 × €10 = €60.'],["Wat betekent 'eerst jezelf betalen' bij sparen?",['Eerst je boodschappen betalen','Eerst een vast spaarbedrag reserveren','Eerst nieuwe spullen kopen'],1,'Je zet spaargeld opzij zodra je inkomen binnenkomt.'],['Welke keuze helpt bij het bereiken van €1.000 spaargeld?',['Regelmatig bijdragen en je voortgang volgen','Geen spaardoel afspreken','Alleen grote bedragen sparen'],0,'Ook kleine, regelmatige bijdragen brengen je dichter bij je doel.']]},{name:'De Uitgavenjager',icon:'☕',tip:'Bewust omgaan met dagelijkse uitgaven maakt ruimte vrij voor je spaardoel.',qs:[['Je bespaart €3 per werkdag. Wat levert 5 dagen op?',['€12','€15','€18'],1,'5 × €3 = €15.'],['Wat is een vaste last?',['Maandelijkse huur','Een incidenteel verjaardagscadeau','Een eenmalige bioscoopkaart'],0,'Huur is een terugkerende verplichting.'],['Je zegt een abonnement van €8 per maand op. Jaarbesparing?',['€80','€88','€96'],2,'12 × €8 = €96.'],['Wat helpt om impulsaankopen te beperken?',['Alles meteen kopen','Een wachttijd gebruiken','Niet naar prijzen kijken'],1,'Een wachttijd geeft ruimte om te bepalen of je iets echt nodig hebt.'],['Wat is doorgaans een variabele uitgave?',['Een vast maandabonnement','Een vaste huurbetaling','Boodschappen'],2,'Boodschappenbedragen verschillen meestal per keer.'],['Je koopt vier keer per week koffie van €2. Hoeveel per week?',['€8','€6','€10'],0,'4 × €2 = €8.'],['Wat is een nuttige eerste stap bij besparen?',['Alle kosten gokken','Je uitgaven bijhouden','Geen rekeningoverzicht bekijken'],1,'Met inzicht in je uitgaven zie je waar ruimte zit.']]},{name:'De Bufferbewaker',icon:'🛡️',tip:'Een noodbuffer beschermt je tegen onverwachte noodzakelijke kosten.',qs:[['Waarvoor is een noodbuffer bedoeld?',['Onverwachte noodzakelijke kosten','Een luxe vakantie','Een spelcomputer'],0,'Een buffer vangt financiële tegenvallers op.'],['Wat is een voorbeeld van een onverwachte noodzakelijke uitgave?',['Een festivalkaartje','Een kapotte wasmachine','Een extra streamingabonnement'],1,'Een kapotte noodzakelijke huishoudelijke machine kan een bufferuitgave zijn.'],['Wat is een voordeel van een noodbuffer?',['Je hoeft nooit meer te werken','Je krijgt gegarandeerd hoge rente','Je kunt onverwachte kosten beter opvangen'],2,'Je hoeft bij een tegenvaller minder snel te lenen.'],['Je buffer is €300 en je betaalt €75 aan een reparatie. Wat blijft over?',['€225','€235','€275'],0,'€300 − €75 = €225.'],['Wat kun je doen nadat je je buffer hebt gebruikt?',['De buffer negeren','De buffer weer aanvullen','Al je spaargeld uitgeven'],1,'Aanvullen herstelt je financiële vangnet.'],['Wat maakt geld geschikt als noodbuffer?',['Dat het moeilijk bereikbaar is','Dat het altijd belegd is','Dat het snel beschikbaar is'],2,'Voor onverwachte kosten moet je er vlot bij kunnen.'],['Waarom is een bufferbedrag persoonlijk?',['Noodzakelijke kosten verschillen per huishouden','Iedereen heeft dezelfde lasten','Alle reparaties kosten evenveel'],0,'Je situatie en vaste lasten bepalen mede hoeveel buffer handig is.']]}];
const KEY='savings-adventure-kp-v1';const SAVEKEY='savings-league-euro-v2';let savings={Dontae:10,Bregje:10};try{const v=JSON.parse(localStorage.getItem(SAVEKEY));if(v&&Number.isFinite(v.Dontae)&&Number.isFinite(v.Bregje??v.Kitten))savings={Dontae:v.Dontae,Bregje:v.Bregje??v.Kitten}}catch{}let demoSavings=null;const blank=()=>({kp:0,kc:0,unlocked:0,finished:[]});let saved;try{saved=JSON.parse(localStorage.getItem(KEY))}catch{}let data={Dontae:{...blank(),...(saved?.Dontae||{})},Bregje:{...blank(),...(saved?.Bregje||saved?.Kitten||{})}};if(saved?.Dontae?.kp&&!saved?.Dontae?.kc){data.Dontae.kc=saved.Dontae.kp;data.Dontae.kp=0;}if(saved?.Kitten?.kp&&!saved?.Bregje?.kc){data.Bregje.kc=saved.Kitten.kp;data.Bregje.kp=0;}data.Dontae.kp=Number(data.Dontae.kp)||0;data.Bregje.kp=Number(data.Bregje.kp)||0;let player='Dontae',section='game',phase='map',level=0,question=0,lives=3,correct=0,answer=null,credited=false;const el=document.getElementById('screen');function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}}function setPlayer(p){player=p;phase='map';render()}function setSection(s){section=s;phase='map';render()}function start(i){if(i>data[player].unlocked)return;level=i;phase='quiz';question=0;lives=3;correct=0;answer=null;credited=data[player].finished.includes(i);render()}function choose(i){if(answer!==null)return;answer=i;if(i===levels[level].qs[question][2])correct++;else lives=Math.max(0,lives-1);render()}function advance(){if(answer===null)return;if(question===6||lives===0){phase='result';if(!credited){data[player].kc+=correct*100;data[player].finished.push(level);data[player].unlocked=Math.max(data[player].unlocked,Math.min(levels.length-1,level+1));save();credited=true}}else{question++;answer=null}render()}function addSavings(){const who=document.getElementById('save-who').value,amount=Number(document.getElementById('save-amount').value);if(!Number.isFinite(amount)||amount<=0||amount>10000)return alert('Kies een geldig bedrag tussen €0 en €10.000.');const dest=demoSavings||savings;dest[who]=Math.round((dest[who]+amount)*100)/100;if(!demoSavings){data[who].kp+=Math.round(amount);save();try{localStorage.setItem(SAVEKEY,JSON.stringify(savings))}catch{}}renderSavings('✨ +€'+amount.toLocaleString('nl-NL')+' voor '+who+'!')}function toggleSavingsDemo(){demoSavings=demoSavings?null:{...savings};renderSavings()}function renderSavings(message=''){const v=demoSavings||savings,total=v.Dontae+v.Bregje,clamped=Math.min(total,10000),level=Math.min(10,Math.floor(clamped/1000)),within=clamped>=10000?1000:clamped%1000,percent=clamped>=10000?100:within/10;el.innerHTML=`<section class="panel"><h2>💰 Onze €10.000 Savings League</h2><p class="muted small">${demoSavings?'🧪 TESTMODUS — je echte bedragen veranderen niet':'Voortgang wordt op dit apparaat bewaard · +1 KP per gespaarde euro'}</p><div class="saving-total">€${total.toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="bar"><div style="width:${Math.min(100,total/100)}%"></div></div><p class="muted small">${Math.min(100,total/100).toFixed(1)}% van €10.000 · Nog €${Math.max(0,10000-total).toLocaleString('nl-NL')}</p><div class="stats"><div class="stat">DONTAE<strong>€${v.Dontae.toLocaleString('nl-NL')}</strong></div><div class="stat">BREGJE<strong>€${v.Bregje.toLocaleString('nl-NL')}</strong></div></div><h2>🏅 Level ${Math.min(10,level+1)} ${level===10?'— voltooid!':''}</h2><div class="bar"><div style="width:${percent}%"></div></div><p class="muted small">${within.toLocaleString('nl-NL')} / 1.000 binnen dit level</p><div class="badge-grid">${Array.from({length:10},(_,i)=>`<div class="badge-tile ${i<level?'achieved':i===level?'current':''}">${i<level?'★':'⬡'}<small>${i+1}</small></div>`).join('')}</div>${message?`<div class="feedback"><strong>${message}</strong></div>`:''}<div class="tip">🐾 ${player}: ${data[player].kp} KP verdiend met sparen. Quizmunten: ${data[player].kc} KC.</div><h2>➕ Spaargeld toevoegen</h2><label>Wie spaart?</label><select id="save-who"><option>Dontae</option><option>Bregje</option></select><label>Bedrag</label><select id="save-amount"><option value="5">€5</option><option value="10" selected>€10</option><option value="20">€20</option><option value="25">€25</option><option value="50">€50</option><option value="100">€100</option><option value="250">€250</option><option value="500">€500</option><option value="1000">€1.000</option></select><button class="btn" onclick="addSavings()">✨ Toevoegen</button><button class="btn secondary" onclick="toggleSavingsDemo()">${demoSavings?'Testmodus verlaten':'🧪 Testmodus aanzetten'}</button><p class="muted small">Dit is een persoonlijke registratie, geen bankkoppeling. Bij echt sparen ontvang je 1 KP per €1. In testmodus verdien je geen KP. Adventure levert KC op.</p></section>`}function reset(){if(!confirm('Alle demo-KC en voortgang van beide spelers wissen?'))return;data={Dontae:blank(),Bregje:blank()};save();phase='map';render()}function render(){document.getElementById('nav-game').classList.toggle('active',section==='game');document.getElementById('nav-save').classList.toggle('active',section==='save');document.getElementById('wallet').textContent=(section==='save'?data[player].kp+' KP':data[player].kc+' KC');document.getElementById('dontae').classList.toggle('active',player==='Dontae');document.getElementById('kitten').classList.toggle('active',player==='Bregje');let p=data[player];if(section==='save'){renderSavings();return}if(phase==='map'){el.innerHTML=`<section class="panel"><h2>🗺️ Het avonturenpad</h2><p class="muted small">Tik op een vrijgespeelde zeshoek. Elk vakje heeft 7 vragen en een eigen beloningsscherm.</p><div class="stats"><div class="stat">VOLTOOID<strong>${p.finished.length}/${levels.length}</strong></div><div class="stat">KITTEN COINS<strong>${p.kc} KC</strong></div></div><div class="path">${levels.map((l,i)=>`<button class="hex ${p.finished.includes(i)?'done':i<=p.unlocked?'available':''}" ${i>p.unlocked?'disabled':''} onclick="start(${i})"><span><span class="symbol">${l.icon}</span>Level ${i+1}<small>${p.finished.includes(i)?'✓ Klaar':i<=p.unlocked?'Spelen':'🔒'}</small></span></button>`).join('')}</div><p class="muted small">🟢 Voltooid · 🟡 Beschikbaar · 🔒 Vergrendeld</p></section><section class="panel"><h2>🏆 KC-scorebord</h2><p>Dontae: <b>${data.Dontae.kc} KC</b></p><p>Bregje: <b>${data.Bregje.kc} KC</b></p><p class="muted">Samen: ${data.Dontae.kc+data.Bregje.kc} KC</p><button class="btn secondary" onclick="reset()">Demo resetten</button></section>`}else if(phase==='quiz'){const q=levels[level].qs[question];el.innerHTML=`<section class="panel"><div class="eyebrow">LEVEL ${level+1} · ${levels[level].name}</div><div class="stats"><div class="stat">VRAAG<strong>${question+1}/7</strong></div><div class="stat">LEVENS<strong>${'❤️'.repeat(lives)}${'♡'.repeat(3-lives)}</strong></div><div class="stat">DIT LEVEL<strong>${correct*100} KC</strong></div></div><div class="bar"><div style="width:${((question+(answer!==null?1:0))/7)*100}%"></div></div><div class="tip">💡 ${levels[level].tip}</div><h2>${q[0]}</h2>${q[1].map((opt,i)=>`<button class="option ${answer!==null&&i===q[2]?'good':answer===i?'bad':''}" ${answer!==null?'disabled':''} onclick="choose(${i})"><b>${'ABC'[i]}</b><span>${opt}</span></button>`).join('')}${answer!==null?`<div class="feedback ${answer===q[2]?'':'bad'}"><strong>${answer===q[2]?'✨ +100 KC!':'💔 Eén leven kwijt'}</strong><p>${q[3]}</p></div><button class="btn" onclick="advance()">${question===6||lives===0?'Bekijk je beloning 🎉':'Volgende vraag →'}</button>`:''}</section>`}else{el.innerHTML=`<section class="panel result"><div class="big">🏆🐾</div><h2>${correct===7?'PERFECT LEVEL!':correct>=4?'GOED GEDAAN!':'MISSIE AFGEROND!'}</h2><p class="muted">${player}, je hebt ${levels[level].name} gespeeld!</p><div class="reward">+${correct*100} KC ✨</div><p>Goed beantwoord: <b>${correct}/7</b></p><p>Levens over: ${'❤️'.repeat(lives)}${'♡'.repeat(3-lives)}</p><div class="tip">${level<levels.length-1?'🔓 Volgend zeshoekig vakje vrijgespeeld!':'👑 Alle demo-levels afgerond!'}</div>${level<levels.length-1?`<button class="btn" onclick="start(${level+1})">Naar level ${level+2} →</button>`:''}<button class="btn secondary" onclick="phase='map';render()">Terug naar het spaarpad</button></section>`}}render();
</script></body></html>
